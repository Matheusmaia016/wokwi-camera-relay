<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Câmera ESP32</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 25px;
}

video {
    width: 95%;
    max-width: 500px;
    margin-top: 20px;
    border-radius: 12px;
    background: black;
}

button {
    margin-top: 20px;
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
}

#status {
    margin: 20px;
}

</style>

</head>

<body>

<h1>📷 Câmera ESP32</h1>

<video
    id="video"
    autoplay
    playsinline>
</video>

<br>

<button onclick="iniciarCamera()">
    Iniciar câmera
</button>

<div id="status">
    Aguardando...
</div>

<canvas
    id="canvas"
    width="320"
    height="240"
    hidden>
</canvas>

<script>

let video =
    document.getElementById("video");

let canvas =
    document.getElementById("canvas");

let ctx =
    canvas.getContext("2d");

let status =
    document.getElementById("status");

let socket;


async function iniciarCamera() {

    try {

        status.innerText =
            "Pedindo permissão para a câmera...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: 320,
                    height: 240
                },

                audio: false
            });


        video.srcObject = stream;

        status.innerText =
            "📷 Câmera ativada!";


        conectarRelay();

    }

    catch (erro) {

        console.error(erro);

        status.innerText =
            "❌ Não foi possível acessar a câmera.";

        alert(
            "Permita o acesso à câmera no navegador."
        );

    }

}


function conectarRelay() {

    const protocolo =
        location.protocol === "https:"
        ? "wss://"
        : "ws://";


    socket = new WebSocket(
        protocolo +
        location.host +
        "/camera"
    );


    socket.binaryType =
        "arraybuffer";


    socket.onopen = () => {

        status.innerText =
            "📡 Celular conectado ao relay.";

        enviarFrame();

    };


    socket.onclose = () => {

        status.innerText =
            "⚠️ Relay desconectado.";

    };


    socket.onerror = () => {

        status.innerText =
            "❌ Erro no relay.";

    };

}


function enviarFrame() {

    if (!socket ||
        socket.readyState !== WebSocket.OPEN) {

        setTimeout(
            enviarFrame,
            500
        );

        return;
    }


    ctx.drawImage(
        video,
        0,
        0,
        320,
        240
    );


    canvas.toBlob(
        blob => {

            if (!blob) return;


            blob.arrayBuffer()
                .then(buffer => {

                    if (
                        socket.readyState ===
                        WebSocket.OPEN
                    ) {

                        socket.send(buffer);

                    }

                    setTimeout(
                        enviarFrame,
                        150
                    );

                });

        },

        "image/jpeg",

        0.45
    );

}

</script>

</body>

</html>
